services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: settings
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:?DJANGO_CORS_ALLOWED_ORIGINS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /app/db.sqlite3
      SINGPAY_BASE_URL: ${SINGPAY_BASE_URL}
      SINGPAY_CLIENT_ID: ${SINGPAY_CLIENT_ID}
      SINGPAY_CLIENT_SECRET: ${SINGPAY_CLIENT_SECRET}
      SINGPAY_WALLET_ID: ${SINGPAY_WALLET_ID}
      SINGPAY_DISBURSEMENT_ID: ${SINGPAY_DISBURSEMENT_ID}
      SINGPAY_TIMEOUT: ${SINGPAY_TIMEOUT:-30}
      SINGPAY_ENABLE_TRANSFER: ${SINGPAY_ENABLE_TRANSFER:-False}
      PAYMENT_SIMULATION_MODE: ${PAYMENT_SIMULATION_MODE:-False}
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - web

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    environment:
      DJANGO_SETTINGS_MODULE: settings
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:?DJANGO_CORS_ALLOWED_ORIGINS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /app/db.sqlite3
      SINGPAY_BASE_URL: ${SINGPAY_BASE_URL}
      SINGPAY_CLIENT_ID: ${SINGPAY_CLIENT_ID}
      SINGPAY_CLIENT_SECRET: ${SINGPAY_CLIENT_SECRET}
      SINGPAY_WALLET_ID: ${SINGPAY_WALLET_ID}
      SINGPAY_DISBURSEMENT_ID: ${SINGPAY_DISBURSEMENT_ID}
      SINGPAY_TIMEOUT: ${SINGPAY_TIMEOUT:-30}
      SINGPAY_ENABLE_TRANSFER: ${SINGPAY_ENABLE_TRANSFER:-False}
      PAYMENT_SIMULATION_MODE: ${PAYMENT_SIMULATION_MODE:-False}
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: settings
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:?DJANGO_CORS_ALLOWED_ORIGINS is required}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /app/db.sqlite3
      SINGPAY_BASE_URL: ${SINGPAY_BASE_URL}
      SINGPAY_CLIENT_ID: ${SINGPAY_CLIENT_ID}
      SINGPAY_CLIENT_SECRET: ${SINGPAY_CLIENT_SECRET}
      SINGPAY_WALLET_ID: ${SINGPAY_WALLET_ID}
      SINGPAY_DISBURSEMENT_ID: ${SINGPAY_DISBURSEMENT_ID}
      SINGPAY_TIMEOUT: ${SINGPAY_TIMEOUT:-30}
      SINGPAY_ENABLE_TRANSFER: ${SINGPAY_ENABLE_TRANSFER:-False}
      PAYMENT_SIMULATION_MODE: ${PAYMENT_SIMULATION_MODE:-False}
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  staticfiles:
  frontend_node_modules:
