# Gaboshop - environnement de TEST (branche `staging`), séparé de la production.
# On y pousse d'abord les changements, on vérifie, puis on fusionne `staging` dans `main`.
#
# Mise en place (une seule fois) sur Render : New > Blueprint > dépôt Gaboshop,
# branche `staging`, « Blueprint Path » = render-staging.yaml.
# Base de données : une base Postgres GRATUITE de Render, créée automatiquement ici
# (le compte Supabase gratuit est limité à 2 projets). Elle expire 30 jours après sa création :
# c'est une base de test, on la recrée (Render > Blueprint > Manual sync) et le compte admin
# est recréé tout seul au démarrage. Jamais de vraies données ni de vraie clé de paiement ici.
databases:
  - name: gaboshop-db-staging
    plan: free
    region: frankfurt
    databaseName: gaboshop_test
    ipAllowList: []

services:
  - type: web
    name: gaboshop-api-staging
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    region: frankfurt
    branch: staging
    healthCheckPath: /api/v1/stores/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: settings
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_BEHIND_PROXY
        value: "1"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      # Base de test de Render (réseau privé de Render, même région).
      - key: DATABASE_URL
        fromDatabase:
          name: gaboshop-db-staging
          property: connectionString
      - key: DATABASE_SSLMODE
        value: prefer
      # Adresse du site web de test, sans / final. Render a ajouté le suffixe -uvn1 aux noms
      # (un Blueprint existait déjà sur ce dépôt) : si le Blueprint est recréé, adapter ces adresses.
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: https://gaboshop-web-staging-uvn1.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://gaboshop-web-staging-uvn1.onrender.com
      # Pas de Redis en test : cache en mémoire, tâches exécutées dans la requête.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "1"
      - key: GUNICORN_WORKERS
        value: "1"
      # Pas de simulation : avec les clés SingPay, on veut voir les vraies erreurs.
      - key: PAYMENT_SIMULATION_MODE
        value: "0"
      - key: SINGPAY_ENABLE_TRANSFER
        value: "False"
      # Adresse publique de l'API SingPay (pas un secret). Les clés SINGPAY_CLIENT_ID,
      # SINGPAY_CLIENT_SECRET et SINGPAY_WALLET_ID se saisissent dans Render > Environment.
      - key: SINGPAY_BASE_URL
        value: https://gateway.singpay.ga/v1
      # Boutique de test avec un article à 100 F (voir stores/management/commands/seed_test_shop.py).
      - key: STAGING_TEST_SHOP
        value: "1"
      # Facultatif : la même clé Groq gratuite que la production pour tester l'assistant.
      - key: GROQ_API_KEY
        sync: false
      # Compte admin créé au premier démarrage de la base de test (ton numéro, un mot de passe de test).
      - key: DJANGO_SUPERUSER_PHONE
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: gaboshop-web-staging
    runtime: static
    rootDir: frontend
    branch: staging
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Adresse de l'API de test (sans / final), lue au moment de la construction du site.
      - key: VITE_API_URL
        value: https://gaboshop-api-staging-uvn1.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
