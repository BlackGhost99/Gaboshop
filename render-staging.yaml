# Gaboshop - environnement de TEST (branche `staging`), séparé de la production.
# On y pousse d'abord les changements, on vérifie, puis on fusionne `staging` dans `main`.
#
# Mise en place (une seule fois) sur Render : New > Blueprint > dépôt Gaboshop,
# branche `staging`, « Blueprint Path » = render-staging.yaml.
# Base de données : un DEUXIÈME projet Supabase (gratuit), jamais celui de la production.
# Les paiements restent simulés et aucune clé de paiement réelle n'est à mettre ici.
services:
  - type: web
    name: gaboshop-api-staging
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    branch: staging
    healthCheckPath: /api/v1/stores/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: settings
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_BEHIND_PROXY
        value: "1"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      # Supabase du projet de TEST : Connect > Session pooler, à coller dans Render.
      - key: DATABASE_URL
        sync: false
      # Adresse du site web de test (ci-dessous), sans / final.
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      # Pas de Redis en test : cache en mémoire, tâches exécutées dans la requête.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "1"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: PAYMENT_SIMULATION_MODE
        value: "1"
      - key: SINGPAY_ENABLE_TRANSFER
        value: "False"
      # Facultatif : la même clé Groq gratuite que la production pour tester l'assistant.
      - key: GROQ_API_KEY
        sync: false
      # Compte admin créé au premier démarrage de la base de test (ton numéro, un mot de passe de test).
      - key: DJANGO_SUPERUSER_PHONE
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: gaboshop-web-staging
    runtime: static
    rootDir: frontend
    branch: staging
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Adresse de l'API de test, ex: https://gaboshop-api-staging.onrender.com (sans / final)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
