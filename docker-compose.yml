services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: settings
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-this-before-production}
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /app/db.sqlite3
      SINGPAY_BASE_URL: ${SINGPAY_BASE_URL}
      SINGPAY_CLIENT_ID: ${SINGPAY_CLIENT_ID}
      SINGPAY_CLIENT_SECRET: ${SINGPAY_CLIENT_SECRET}
      SINGPAY_WALLET_ID: ${SINGPAY_WALLET_ID}
      SINGPAY_DISBURSEMENT_ID: ${SINGPAY_DISBURSEMENT_ID}
      SINGPAY_TIMEOUT: ${SINGPAY_TIMEOUT:-30}
      SINGPAY_ENABLE_TRANSFER: ${SINGPAY_ENABLE_TRANSFER:-False}
      PAYMENT_SIMULATION_MODE: ${PAYMENT_SIMULATION_MODE:-False}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://web:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      web:
        condition: service_started

  celery_worker:
    build:
      context: .
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: settings
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-this-before-production}
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /app/db.sqlite3
      SINGPAY_BASE_URL: ${SINGPAY_BASE_URL}
      SINGPAY_CLIENT_ID: ${SINGPAY_CLIENT_ID}
      SINGPAY_CLIENT_SECRET: ${SINGPAY_CLIENT_SECRET}
      SINGPAY_WALLET_ID: ${SINGPAY_WALLET_ID}
      SINGPAY_DISBURSEMENT_ID: ${SINGPAY_DISBURSEMENT_ID}
      SINGPAY_TIMEOUT: ${SINGPAY_TIMEOUT:-30}
      SINGPAY_ENABLE_TRANSFER: ${SINGPAY_ENABLE_TRANSFER:-False}
      PAYMENT_SIMULATION_MODE: ${PAYMENT_SIMULATION_MODE:-False}
    depends_on:
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
    restart: unless-stopped
    command: celery -A celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: settings
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-this-before-production}
      REDIS_URL: redis://redis:6379/0
      SQLITE_PATH: /app/db.sqlite3
      SINGPAY_BASE_URL: ${SINGPAY_BASE_URL}
      SINGPAY_CLIENT_ID: ${SINGPAY_CLIENT_ID}
      SINGPAY_CLIENT_SECRET: ${SINGPAY_CLIENT_SECRET}
      SINGPAY_WALLET_ID: ${SINGPAY_WALLET_ID}
      SINGPAY_DISBURSEMENT_ID: ${SINGPAY_DISBURSEMENT_ID}
      SINGPAY_TIMEOUT: ${SINGPAY_TIMEOUT:-30}
      SINGPAY_ENABLE_TRANSFER: ${SINGPAY_ENABLE_TRANSFER:-False}
      PAYMENT_SIMULATION_MODE: ${PAYMENT_SIMULATION_MODE:-False}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  frontend_node_modules:
