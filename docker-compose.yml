# Gaboshop - local development stack.
# Use ./gaboshop.ps1 (up, down, logs, test, apk...) rather than calling this directly.
# Production: docker-compose.prod.yml

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: settings
  DJANGO_DEBUG: "1"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-this-before-production}
  # GABOSHOP_LAN_IP lets a phone on the same Wi-Fi reach the API (set by gaboshop.ps1)
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,10.0.2.2,${GABOSHOP_LAN_IP:-127.0.0.1}
  REDIS_URL: redis://redis:6379/0
  SQLITE_PATH: /app/db.sqlite3
  SINGPAY_BASE_URL: ${SINGPAY_BASE_URL:-https://gateway.singpay.ga/v1}
  SINGPAY_CLIENT_ID: ${SINGPAY_CLIENT_ID:-}
  SINGPAY_CLIENT_SECRET: ${SINGPAY_CLIENT_SECRET:-}
  SINGPAY_WALLET_ID: ${SINGPAY_WALLET_ID:-}
  SINGPAY_DISBURSEMENT_ID: ${SINGPAY_DISBURSEMENT_ID:-}
  SINGPAY_TIMEOUT: ${SINGPAY_TIMEOUT:-30}
  SINGPAY_ENABLE_TRANSFER: ${SINGPAY_ENABLE_TRANSFER:-False}
  PAYMENT_SIMULATION_MODE: ${PAYMENT_SIMULATION_MODE:-False}

x-backend: &backend
  build:
    context: .
  restart: unless-stopped
  volumes:
    - .:/app
  environment: *backend-env
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  celery_worker:
    <<: *backend
    command: celery -A celery_app worker --loglevel=info --concurrency=2

  celery_beat:
    <<: *backend
    command: celery -A celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://web:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      web:
        condition: service_started

  # Android APK builder - only runs on demand: ./gaboshop.ps1 apk
  android:
    profiles: ["android"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.android
    volumes:
      - ./frontend:/app
      - android_node_modules:/app/node_modules
      - android_gradle:/root/.gradle
      - ./builds/android:/out
    environment:
      APK_MODE: ${APK_MODE:-dev}
      # Address of the API as seen from the phone
      VITE_API_URL: ${APK_API_URL:-http://10.0.2.2:8000}

volumes:
  redis_data:
  frontend_node_modules:
  android_node_modules:
  android_gradle:
