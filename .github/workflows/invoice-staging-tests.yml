name: Facture PDF Gaboshop (staging)
on:
  push:
    branches: [staging]
    paths:
      - 'orders/invoice.py'
      - 'orders/templates/orders/invoice.html'
      - 'orders/tests/test_choix_et_facture_2026_10_16.py'
      - '.github/workflows/invoice-staging-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoice-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: gaboshop.settings
      DJANGO_SECRET_KEY: staging-invoice-tests-only-not-production-0123456789abcdefgh
      DJANGO_DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer dépendances PDF / Django
        run: pip install -r requirements.txt
      - name: Valider modèle et migrations
        run: |
          python manage.py check
          python manage.py migrate --noinput
      - name: Valider facture et droits d'accès
        run: python manage.py test orders.tests.test_choix_et_facture_2026_10_16 --noinput -v 2
