name: Journal actions commandes commerces
on:
  push:
    branches: [feat/store-order-activity-audit-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SECRET_KEY: test-store-activity-audit-only-not-production
      DJANGO_DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test orders.tests.test_store_order_activity_2026_10_17 orders.tests.test_merchant_order_search_2026_10_17 payments.tests.test_merchant_order_traceability_2026_10_17 --noinput -v 2
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
