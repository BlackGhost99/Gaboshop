# Construit la version Play Store de Gaboshop (fichier .aab signé), à lancer à la main :
# GitHub > Actions > « Version Play Store » > Run workflow.
# Le fichier est publié dans la release « android-playstore » :
# https://github.com/BlackGhost99/Gaboshop/releases/tag/android-playstore
#
# Clé d'envoi (upload key) : le seul secret à créer est ANDROID_KEY_PASSWORD
# (Settings > Secrets and variables > Actions), au moins 16 caractères, à garder précieusement.
# Au premier lancement, la clé est créée puis enregistrée dans le dépôt CHIFFRÉE avec ce mot de passe
# (frontend/android/upload-key.jks.enc) ; les lancements suivants la réutilisent.
# Si le mot de passe est perdu, Google Play permet de réinitialiser la clé d'envoi (Play App Signing).
name: Version Play Store

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-playstore
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ENC_FILE: android/upload-key.jks.enc
      KEY_FILE: ${{ github.workspace }}/upload-key.jks
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier le mot de passe de signature
        run: |
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Créez d'abord le secret ANDROID_KEY_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ ${#KEY_PASSWORD} -lt 16 ]; then
            echo "::error::ANDROID_KEY_PASSWORD doit faire au moins 16 caractères."
            exit 1
          fi

      - name: Créer ou récupérer la clé d'envoi
        run: |
          if [ -f "$ENC_FILE" ]; then
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:KEY_PASSWORD -in "$ENC_FILE" -out "$KEY_FILE"; then
              echo "::error::Impossible de déchiffrer la clé : ANDROID_KEY_PASSWORD n'est pas celui utilisé à sa création."
              exit 1
            fi
          else
            keytool -genkeypair -keystore "$KEY_FILE" -storetype PKCS12 \
              -storepass:env KEY_PASSWORD -keypass:env KEY_PASSWORD \
              -alias upload -keyalg RSA -keysize 4096 -validity 12000 \
              -dname "CN=Gaboshop, O=Gaboshop, L=Libreville, C=GA"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -pass env:KEY_PASSWORD -in "$KEY_FILE" -out "$ENC_FILE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$ENC_FILE"
            git commit -m "Clé d'envoi Play Store (chiffrée)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          keytool -list -keystore "$KEY_FILE" -storepass:env KEY_PASSWORD -alias upload > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - run: npm ci
      - name: Build web + synchronisation Capacitor (API de production)
        run: npm run android:prod

      - name: Construire le fichier .aab signé
        working-directory: frontend/android
        env:
          GABOSHOP_UPLOAD_KEYSTORE: ${{ github.workspace }}/upload-key.jks
          GABOSHOP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Toujours au-dessus des numéros des APK de test
          GABOSHOP_VERSION_CODE: ${{ github.run_number }}000
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | tail -1
          jarsigner -verify "$AAB" | grep -q "jar verified"
          cp "$AAB" "$GITHUB_WORKSPACE/gaboshop-playstore.aab"
          rm -f "$GITHUB_WORKSPACE/upload-key.jks"

      - name: Publier dans la release android-playstore
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-playstore --cleanup-tag -y || true
          gh release create android-playstore gaboshop-playstore.aab \
            --target "$(git rev-parse HEAD)" \
            --title "Version Play Store (${{ github.run_number }}000)" \
            --notes "Fichier .aab signé, à envoyer dans Google Play Console (Tests internes puis Production). Construit depuis $(git rev-parse --short HEAD)."
