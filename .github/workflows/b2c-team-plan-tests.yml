name: Abonnements B2C — équipe paramétrable
on:
  push:
    branches: [feat/b2c-subscription-managed-staff-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SECRET_KEY: test-b2c-subscription-team-only-ci-not-production
      DJANGO_DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test payments.tests.test_b2c_staff_plan_config_2026_10_17 payments.tests.test_forfait_gratuit_2026_10_15 payments.tests.test_outils_forfaits_2026_10_16 --noinput -v 1
  react:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
