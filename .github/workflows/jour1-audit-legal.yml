name: Jour 1 — vérification du projet juridique
on:
  push:
    branches: [audit/jour1-gaboshop-20261016]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paiement-mixte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SECRET_KEY: test-audit-jour1-2026-no-prod-secrets
      DJANGO_DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test payments.tests.test_single_payment payments.tests.test_manual_payments payments.tests.test_security_money_2026_10_15 --noinput -v 1
  front-and-texts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les anciennes affirmations contractuelles
        run: |
          if grep -q "n'encaisse pas l'argent des commandes" frontend/src/pages/legal/CGU.jsx; then
            echo "::error::Ancienne clause paiement non corrigée"
            exit 1
          fi
          if grep -q "CNPDCP" frontend/src/pages/legal/Confidentialite.jsx; then
            echo "::error::Ancienne autorité de protection des données"
            exit 1
          fi
          grep -q "n°025/2021" frontend/src/pages/legal/CGU.jsx
          grep -q "n°025/2023" frontend/src/pages/legal/Confidentialite.jsx
      - name: Installer les dépendances
        run: npm ci --prefix frontend
      - name: Compiler l'application
        run: npm run build --prefix frontend
