# Gaboshop - phase gratuite : Render (API + site web) + Supabase (PostgreSQL).
# L'app Android embarque son propre frontend : seule l'API doit etre en ligne.
# Limites a connaitre : le service gratuit s'endort apres ~15 min d'inactivite
# (premiere requete lente), un projet Supabase gratuit peut etre mis en pause apres
# une semaine d'inactivite, et les fichiers envoyes (photos) sont perdus a chaque
# redeploiement. Ne pas utiliser pour de vrais paiements : voir PAYMENT_SIMULATION_MODE.
services:
  - type: web
    name: gaboshop-api
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    healthCheckPath: /api/v1/stores/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: settings
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_BEHIND_PROXY
        value: "1"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      # Supabase : Connect > Session pooler (compatible IPv4), a coller dans Render.
      - key: DATABASE_URL
        sync: false
      # Adresse du site web statique (ci-dessous) une fois connue, sans / final.
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gaboshop-redis
          property: connectionString
      # Pas de worker gratuit : les taches Celery s'executent dans la requete.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "1"
      # 512 Mo de memoire : un seul processus gunicorn
      - key: GUNICORN_WORKERS
        value: "1"
      # Paiements réels SingPay (8 oct. 2026) : plus de simulation si SingPay ne répond pas.
      - key: PAYMENT_SIMULATION_MODE
        value: "0"
      - key: SINGPAY_ENABLE_TRANSFER
        value: "False"
      - key: SINGPAY_BASE_URL
        value: https://gateway.singpay.ga/v1
      - key: SINGPAY_CLIENT_ID
        sync: false
      - key: SINGPAY_CLIENT_SECRET
        sync: false
      - key: SINGPAY_WALLET_ID
        sync: false
      - key: SINGPAY_DISBURSEMENT_ID
        sync: false

  - type: keyvalue
    name: gaboshop-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # Site web (optionnel pour l'app Android).
  - type: web
    name: gaboshop-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Adresse de l'API, ex: https://gaboshop-api.onrender.com (sans / final)
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
